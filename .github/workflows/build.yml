name: Build

on:
  push:
      branches:
          - master
          - main
  pull_request:
      branches:
          - "*"
  release:
    types: [created]

jobs:

  build:

    runs-on: windows-latest

    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-tool-pacakge
          path: publish/packages/*.nupkg
          retention-days: 1

          
      - name: NuGet login (OIDC → temp API key)
        if: (github.event_name == 'release' && github.event.action == 'created')
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          
      - name: Publish to nuget
        if: (github.event_name == 'release' && github.event.action == 'created')
        shell: pwsh
        run: |
          $files = Get-ChildItem ./publish/packages/ -name '*.nupkg'
          foreach ($file in $files){
            dotnet nuget push "./publish/packages/$file" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
